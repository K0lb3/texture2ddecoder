name: Test
on:
  push

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Python
        uses: actions/setup-python@v5
        if: matrix.os == 'ubuntu-latest'
        with:
          python-version: '3.x'

      - name: Install
        run: pip install .[tests]

      - name: Run tests
        run: pytest -vs ./tests

  build_pyodide:
    name: Build Pyodide (Python 3.14) wheel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Use cibuildwheel to compile and test Pyodide wheel
      - name: Build Pyodide wheel
        uses: joerick/cibuildwheel@v4.3
        with:
          only: cp314-pyodide_wasm32

      - uses: actions/upload-artifact@v4
        with:
          name: "pyodide-wasm32"
          path: ./wheelhouse/*.whl
